[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph2skill"
version = "0.1.0"
description = "Convert cograg domain-decision subgraphs into a ready-to-use Claude Skill package."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "graph2skill contributors" }]
keywords = ["knowledge-graph", "skill", "decision-tree", "troubleshooting"]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0", "PyYAML>=6.0"]

[project.scripts]
graph2skill = "graph2skill.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph2skill = ["resources/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
